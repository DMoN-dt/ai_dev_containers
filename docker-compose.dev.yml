# Контейнеры для локальной разработки

services:
  app:
    # указание имени образа, который будет собран, для переиспользования в AI-контейнерах
    # image: ${PROJECT_NAME:-app}_dev_app:latest
    build:
      context: ${APP_DOCKER_CONTEXT}
      dockerfile: ${APP_DOCKER_FILE}
      args:
        - APP_DIR=/app_${PROJECT_NAME}
        - TZONE=${TIMEZONE:-UTC}
    profiles: ["manual"] # Чтобы не запускать App автоматически в фоне
    environment:
      - PGUSER=${POSTGRES_ADMIN_USER}
      - PGPASSWORD=${POSTGRES_ADMIN_PASSWORD}
      - PGHOST=db_postgres
      - REDIS_URL=redis://db_redis:${REDIS_EXTERNAL_PORT}
      - DB_HOST=db_postgres
      - DB_PORT=${POSTGRES_EXTERNAL_PORT}
      - DB_USER=${POSTGRES_ADMIN_USER}
      - DB_PASSWORD=${POSTGRES_ADMIN_PASSWORD}

      - ROOTLESS_UMASK=true
      - ZSH_DISABLE_COMPFIX=true
      - ZSH_COMPDUMP=/root/.zcompdump

      - BUNDLE_GEMFILE=/app_${PROJECT_NAME}/Gemfile

      - POSTGRES_AI_USER_QWEN=${POSTGRES_AI_USER_QWEN}
      - POSTGRES_AI_PASSWORD_QWEN=${POSTGRES_AI_PASSWORD_QWEN}
    volumes:
      - ${APP_DOCKER_CONTEXT}:/app_${PROJECT_NAME}
      - bundle_data:/usr/local/bundle
      - root_home:/root

      # Папки без монтирования с хоста:
      # - /app_${PROJECT_NAME}/coverage

    working_dir: /app_${PROJECT_NAME}
    depends_on:
      - db_postgres
      - db_redis
    stdin_open: true
    tty: true
    networks:
      - shared_network

  db_postgres:
    build:
      context: ${POSTGRES_DOCKER_CONTEXT}
      dockerfile: ${POSTGRES_DOCKER_FILE}
      args:
        DB_DEV: ${POSTGRES_DB_DEVELOPMENT}
        DB_TEST: ${POSTGRES_DB_TEST}
    # restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0' # Максимум 1 ядро
          memory: 1G
        reservations:
          memory: 256M
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"
    networks:
      - shared_network
      - ai_isolated_network

  db_redis:
    image: redis:7.2-alpine
    # restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50' # Максимум половина ядра
          memory: 512M # Максимальный объем, который может занять контейнер
        reservations:
          memory: 64M # Гарантированный объем, резервируемый при старте
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_EXTERNAL_PORT}:6379"
    networks:
      - shared_network


  # Для каждого AI-агента (или общий для всех AI) лучше запустить отдельный Redis. Это гарантирует 100% изоляцию.
  # volumes не заданы, чтобы кэш сбрасывался при остановке контейнера.
  db_redis_ai:
    image: redis:7.2-alpine
    hostname: db_redis_ai
    profiles: ["ai"]
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
        reservations:
          memory: 32M
    networks:
      - ai_isolated_network

  ai_agent: &ai_agent_template
    build:
      context: ${AI_AGENT_DOCKER_CONTEXT}
      dockerfile: ${AI_AGENT_DOCKER_FILE}
      # args:
      #  Прокси для этапа сборки контейнера:
      #  - http_proxy=${AI_PROXY_URL}
      #  - https_proxy=${AI_PROXY_URL}
    profiles: ["ai"]
    volumes:
      - ${AI_AGENT_DOCKER_CONTEXT}:/app_${PROJECT_NAME}_ai_src:ro # Исходники (только чтение)
      - ${AI_AGENT_DOCKER_WORKTREE}:/app_${PROJECT_NAME}_ai_out:rw # Рабочая папка (запись)

      - ${DEV_DOCKER_TOOLS_PATH:-./.dev}/ai-entrypoint.sh:/ai-entrypoint.sh # Стартовый скрипт
      - ${DEV_DOCKER_TOOLS_PATH:-./.dev}/ai_tools:/app_ai_tools:rw # Скрипты установки агентов

      - bundle_data:/usr/local/bundle
      - root_home:/root
      - ai_python_libs:/python_packages
      - ai_node_libs:/node_packages
    entrypoint: ["/ai-entrypoint.sh"]
    command: ["/bin/zsh"]
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - DB_HOST=db_postgres
      - DB_USER=${POSTGRES_AI_USER_QWEN} # Для каждого агента возможен свой пользователь
      - DB_PASSWORD=${POSTGRES_AI_PASSWORD_QWEN}
      - PGUSER=${POSTGRES_AI_USER_QWEN}
      - PGPASSWORD=${POSTGRES_AI_PASSWORD_QWEN}
      - PGHOST=db_postgres
      - POSTGRES_DB_DEVELOPMENT=ai_${PROJECT_NAME}_qwen_development # Для каждого агента возможна своя БД
      - POSTGRES_DB_TEST=ai_${PROJECT_NAME}_qwen_test
      - POSTGRES_AI_USER_QWEN=${POSTGRES_AI_USER_QWEN}
      - POSTGRES_AI_PASSWORD_QWEN=${POSTGRES_AI_PASSWORD_QWEN}

      - REDIS_URL=redis://db_redis_ai:6379/0

      - ROOTLESS_UMASK=true
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - ZSH_DISABLE_COMPFIX=true
      - ZSH_COMPDUMP=/root/.zcompdump
      - PYTHONUSERBASE=/python_packages
      - PATH=/app_ai_tools/bin:/python_packages/bin:/node_packages/bin:/usr/local/bundle/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      - BUNDLE_GEMFILE=/app_${PROJECT_NAME}_ai_out/Gemfile

      - AI_ACTIVE_PROVIDER=${AI_ACTIVE_PROVIDER:-GROQ}
      - AI_ACTIVE_AGENT=${AI_ACTIVE_AGENT:-AIDER}
      - AI_MODEL_NAME=${AI_MODEL_NAME:-qwen-2.5-coder-32b}

      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_API_BASE=${OPENROUTER_API_BASE}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_BASE=${GROQ_API_BASE}

      # Native providers:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - COPILOT_API_KEY=${COPILOT_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      - http_proxy=${AI_PROXY_URL}
      - https_proxy=${AI_PROXY_URL}
      - no_proxy=${AI_NO_PROXY}

    working_dir: /app_${PROJECT_NAME}_ai_out
    depends_on:
      - db_postgres
      - db_redis_ai
    links:
      - db_postgres
      - db_redis_ai
    networks:
      - ai_isolated_network
      - host_bridge
      # - shared_network # только на время установки пакетов в консоли, чтобы интернет был не через прокси

volumes:
  bundle_data:
  root_home:
  pg_data:
  redis_data:
  ai_python_libs:
  ai_node_libs:

networks:
  host_bridge: # Мост с хостом
    driver: bridge
  shared_network: # Сеть для dev контейнеров, с выходом во внешние сети хоста
    external: true
    name: shared_dev_network
  ai_isolated_network:
    driver: bridge # Сеть для AI компонентов
    internal: true # запрещает выход во внешние сети (в том числе в Интернет)

